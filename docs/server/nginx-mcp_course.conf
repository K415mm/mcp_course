##
# Nginx config for TUNAI LMS — tunai.cloud
# Template extracted from production server 134.199.186.91
# Place at: /etc/nginx/sites-available/mcp_course
# Enable: ln -s /etc/nginx/sites-available/mcp_course /etc/nginx/sites-enabled/
##

server {
    # Defensia bot protection — remove if not using Defensia
    if ($defensia_blocked_ua) { return 444; }

    server_name tunai.cloud www.tunai.cloud;

    # Laravel web root
    root /var/www/mcp_course/webapp/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ignore favicon/robots logs
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM via Unix socket
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to hidden files (except Let's Encrypt challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SSL — managed by Certbot (added automatically by: certbot --nginx)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tunai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunai.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($defensia_blocked_ua) { return 444; }

    # HTTP → HTTPS redirect
    if ($host = www.tunai.cloud) { return 301 https://$host$request_uri; }
    if ($host = tunai.cloud)     { return 301 https://$host$request_uri; }

    listen 80;
    server_name tunai.cloud www.tunai.cloud;
    return 404;
}
